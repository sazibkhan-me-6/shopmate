const money = n => `$${n.toFixed(2)}`;

function App(){
  const [page,setPage]=useState("home");
  const [selected,setSelected]=useState(null);
  const [cart,setCart]=useState(()=>JSON.parse(localStorage.getItem("shopmate-cart")||"[]"));
  const [wishlist,setWishlist]=useState(()=>JSON.parse(localStorage.getItem("shopmate-wishlist")||"[]"));
  const [dark,setDark]=useState(()=>localStorage.getItem("shopmate-dark")==="1");
  const [query,setQuery]=useState("");
  const [toast,setToast]=useState("");
  const [user,setUser]=useState(()=>JSON.parse(localStorage.getItem("shopmate-user")||"null"));
  const [orders,setOrders]=useState(()=>JSON.parse(localStorage.getItem("shopmate-orders")||"[]"));
  const [coupon,setCoupon]=useState("");
  const [couponApplied,setCouponApplied]=useState(false);

  useEffect(()=>localStorage.setItem("shopmate-cart",JSON.stringify(cart)),[cart]);
  useEffect(()=>localStorage.setItem("shopmate-wishlist",JSON.stringify(wishlist)),[wishlist]);
  useEffect(()=>{document.documentElement.classList.toggle("dark",dark);localStorage.setItem("shopmate-dark",dark?"1":"0")},[dark]);
  useEffect(()=>localStorage.setItem("shopmate-user",JSON.stringify(user)),[user]);
  useEffect(()=>localStorage.setItem("shopmate-orders",JSON.stringify(orders)),[orders]);

  const notify=(m)=>{setToast(m);setTimeout(()=>setToast(""),2200)};
  const openProduct=(p)=>{setSelected(p);setPage("product");window.scrollTo({top:0,behavior:"smooth"})};
  const addToCart=(p,qty=1)=>{setCart(c=>{const old=c.find(x=>x.id===p.id);return old?c.map(x=>x.id===p.id?{...x,qty:x.qty+qty}:x):[...c,{...p,qty}]});notify(`${p.name} added to cart`)};
  const toggleWish=(p)=>setWishlist(w=>w.includes(p.id)?w.filter(id=>id!==p.id):[...w,p.id]);
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  const discount=couponApplied?Math.min(total*.1,100):0;
  const shipping=total>=50||total===0?0:6.99;
  const grand=Math.max(0,total-discount+shipping);

  const nav=(p)=>{setPage(p);setSelected(null);window.scrollTo({top:0,behavior:"smooth"})};

  return <div className="app">
    <div className="announcement">🚚 Free shipping on orders over $50 &nbsp; | &nbsp; 30% Off on All Electronics — <b>Shop Now!</b></div>
    <header className="header">
      <button className="brand" onClick={()=>nav("home")}><span className="brandIcon">♜</span> ShopMate</button>
      <nav>{["Home","Shop","Categories","Offers","About","Contact"].map(x=><button key={x} className={page===x.toLowerCase()||(x==="Home"&&page==="home")?"active":""} onClick={()=>nav(x.toLowerCase())}>{x}</button>)}</nav>
      <div className="headActions">
        <div className="searchBox"><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search for products..." onKeyDown={e=>e.key==="Enter"&&nav("shop")}/><span>⌕</span></div>
        <button className="iconBtn" onClick={()=>nav("wishlist")}>♡<i>{wishlist.length}</i></button>
        <button className="iconBtn" onClick={()=>nav("cart")}>🛒<i>{cart.reduce((s,x)=>s+x.qty,0)}</i></button>
        <button className="loginBtn" onClick={()=>nav(user?"profile":"login")}>♙ {user?user.name:"Login / Register"}</button>
        <button className="themeBtn" onClick={()=>setDark(!dark)}>{dark?"☀":"☾"}</button>
      </div>
    </header>

    {page==="home" && <Home openProduct={openProduct} addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist} nav={nav}/>}
    {page==="shop" && <Shop products={products} query={query} setQuery={setQuery} openProduct={openProduct} addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist}/>}
    {page==="categories" && <Categories nav={nav}/>}
    {page==="offers" && <Shop products={products.filter(p=>p.oldPrice)} query={query} setQuery={setQuery} openProduct={openProduct} addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist} offerMode/>}
    {page==="product" && selected && <Product p={selected} addToCart={addToCart} toggleWish={toggleWish} wished={wishlist.includes(selected.id)} nav={nav}/>}
    {page==="cart" && <Cart cart={cart} setCart={setCart} total={total} discount={discount} shipping={shipping} grand={grand} coupon={coupon} setCoupon={setCoupon} couponApplied={couponApplied} setCouponApplied={setCouponApplied} nav={nav}/>}
    {page==="checkout" && <Checkout cart={cart} total={total} discount={discount} shipping={shipping} grand={grand} user={user} setOrders={setOrders} setCart={setCart} nav={nav} notify={notify}/>}
    {page==="login" && <Auth mode="login" setUser={setUser} nav={nav}/>}
    {page==="register" && <Auth mode="register" setUser={setUser} nav={nav}/>}
    {page==="profile" && <Profile user={user} orders={orders} setUser={setUser} nav={nav}/>}
    {page==="wishlist" && <Wishlist items={products.filter(p=>wishlist.includes(p.id))} openProduct={openProduct} addToCart={addToCart} toggleWish={toggleWish}/>}
    {page==="contact" && <Contact/>}
    {page==="about" && <About/>}
    {page==="admin" && <Admin orders={orders} setOrders={setOrders} notify={notify}/>}

    <footer className="footer">
      <div className="footerGrid">
        <div><h3>♜ ShopMate</h3><p>Your one-stop shop for the best products at the best prices. Shop smart, live better.</p><div className="socials">f &nbsp; ◎ &nbsp; ▶ &nbsp; 𝕏 &nbsp; in</div></div>
        <div><h4>Quick Links</h4><button onClick={()=>nav("home")}>Home</button><button onClick={()=>nav("shop")}>Shop</button><button onClick={()=>nav("categories")}>Categories</button><button onClick={()=>nav("offers")}>Offers</button><button onClick={()=>nav("about")}>About</button></div>
        <div><h4>Customer Service</h4><p>Help Center</p><p>Shipping Info</p><p>Returns & Refunds</p><p>Terms & Conditions</p><p>Privacy Policy</p></div>
        <div><h4>Contact Us</h4><p>☎ +880 1614703406</p><p>✉ support@shopmate.com</p><p>⌖ Dhaka, Bangladesh</p></div>
        <div><h4>We Accept</h4><div className="payments">bKash &nbsp; Nagad &nbsp; VISA &nbsp; Master</div></div>
      </div>
      <div className="copyright">© 2026 ShopMate. All rights reserved. <button onClick={()=>nav("admin")}>Admin Demo</button></div>
    </footer>
    {toast&&<div className="toast">✓ {toast}</div>}
  </div>
}

function Home({openProduct,addToCart,toggleWish,wishlist,nav}){
  return <main>
    <section className="hero">
      <div className="heroCopy"><small>NEW ARRIVALS</small><h1>Upgrade Your Style<br/><em>With the Latest Trends</em></h1><p>Discover premium quality products at unbeatable prices. Shop the best deals, only at <b>ShopMate.</b></p><button className="primary" onClick={()=>nav("shop")}>Shop Now →</button><div className="benefits"><span>🚚 <b>Free Shipping</b><small>On orders over $50</small></span><span>▣ <b>Secure Payment</b><small>100% secure checkout</small></span><span>◉ <b>24/7 Support</b><small>We're here to help</small></span></div></div>
      <div className="heroVisual"><div className="blob"></div><img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1000&q=85"/><div className="scribble">Better<br/>Lifestyle</div></div>
    </section>
    <SectionTitle title="Featured Categories" sub="Shop by category and find exactly what you need." action="View All →" onClick={()=>nav("categories")}/>
    <div className="catGrid">{categories.map(([name,img])=><button className="catCard" key={name} onClick={()=>nav("shop")}><img src={img}/><b>{name}</b></button>)}</div>
    <SectionTitle title="Best Selling Products" sub="Our most popular products, loved by customers." action="View All →" onClick={()=>nav("shop")}/>
    <div className="productGrid">{products.slice(0,5).map(p=><ProductCard key={p.id} p={p} openProduct={openProduct} addToCart={addToCart} toggleWish={toggleWish} wished={wishlist.includes(p.id)}/>)}</div>
    <div className="promoGrid"><div className="promo darkPromo"><div><h2>BIG SALE</h2><h3>Up to 50% OFF</h3><p>On Selected Items</p><button className="primary" onClick={()=>nav("offers")}>Shop Now →</button></div><span className="discountBubble">50%<br/>OFF</span></div><div className="promo greenPromo"><div><h2>Fresh Looks<br/>For Every Season</h2><p>Fashion Collection 2026</p><button onClick={()=>nav("shop")}>Shop Now →</button></div></div></div>
    <SectionTitle title="What Our Customers Say" sub="Real reviews from real customers." action="View All Reviews →"/>
    <div className="reviews">{[["Rahul Ahmed","Amazing products and fast delivery! The quality is better than I expected. Highly recommended.","2 days ago"],["Sarah Khan","Great customer service and easy return process. Will definitely shop again!","4 days ago"],["Imran Hossain","The website is very user-friendly and the products are original. Love it!","1 week ago"]].map((r,i)=><div className="review" key={r[0]}><div className="avatar">{["R","S","I"][i]}</div><div><b>{r[0]}</b><small>🟢 Verified Buyer</small><div className="stars">★★★★★</div><p>“{r[1]}”</p><small>{r[2]}</small></div></div>)}</div>
    <Newsletter/>
  </main>
}

function SectionTitle({title,sub,action,onClick}){return <div className="sectionTitle"><div><h2>{title}</h2><p>{sub}</p></div>{action&&<button onClick={onClick}>{action}</button>}</div>}
function ProductCard({p,openProduct,addToCart,toggleWish,wished}){return <article className="productCard"><div className="productImg"><span className="sale">-{Math.round((1-p.price/p.oldPrice)*100)}%</span><button className="wish" onClick={()=>toggleWish(p)}>{wished?"♥":"♡"}</button><img src={p.img} onClick={()=>openProduct(p)}/></div><div className="productInfo"><h3 onClick={()=>openProduct(p)}>{p.name}</h3><div className="stars">★★★★★ <small>({p.reviews})</small></div><div className="price">{money(p.price)} <del>{money(p.oldPrice)}</del></div><button className="add" onClick={()=>addToCart(p)}>🛒 Add to Cart</button></div></article>}

function Shop({products:all,query,setQuery,openProduct,addToCart,toggleWish,wishlist,offerMode=false}){
  const [cat,setCat]=useState("All"),[brand,setBrand]=useState("All"),[sort,setSort]=useState("popular"),[max,setMax]=useState(1200);
  const brands=["All",...new Set(all.map(p=>p.brand))], cats=["All",...new Set(all.map(p=>p.category))];
  const list=useMemo(()=>all.filter(p=>(cat==="All"||p.category===cat)&&(brand==="All"||p.brand===brand)&&p.price<=max&&p.name.toLowerCase().includes((query||"").toLowerCase())).sort((a,b)=>sort==="low"?a.price-b.price:sort==="high"?b.price-a.price:sort==="new"?b.id-a.id:b.rating-a.rating),[all,cat,brand,max,sort,query]);
  return <main className="container"><div className="pageHead"><div><small>SHOP</small><h1>{offerMode?"Today's Offers":"All Products"}</h1><p>{list.length} products found</p></div></div><div className="shopLayout"><aside className="filters"><h3>Filters</h3><label>Category<select value={cat} onChange={e=>setCat(e.target.value)}>{cats.map(x=><option key={x}>{x}</option>)}</select></label><label>Brand<select value={brand} onChange={e=>setBrand(e.target.value)}>{brands.map(x=><option key={x}>{x}</option>)}</select></label><label>Max Price <b>${max}</b><input type="range" min="20" max="1200" step="10" value={max} onChange={e=>setMax(+e.target.value)}/></label><button className="reset" onClick={()=>{setCat("All");setBrand("All");setMax(1200);if(setQuery)setQuery("")}}>Reset Filters</button></aside><section><div className="shopToolbar"><input value={query||""} onChange={e=>setQuery&&setQuery(e.target.value)} placeholder="Search products..."/><select value={sort} onChange={e=>setSort(e.target.value)}><option value="popular">Most Popular</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="new">Newest</option></select></div><div className="productGrid">{list.map(p=><ProductCard key={p.id} p={p} openProduct={openProduct} addToCart={addToCart} toggleWish={toggleWish} wished={wishlist.includes(p.id)}/>)}</div>{!list.length&&<div className="empty">No products match your filters.</div>}</section></div></main>
}

function Product({p,addToCart,toggleWish,wished,nav}){const [qty,setQty]=useState(1),[size,setSize]=useState(p.sizes[0]||""),[color,setColor]=useState(p.colors[0]||"");return <main className="container"><button className="back" onClick={()=>nav("shop")}>← Back to Shop</button><div className="productDetail"><div className="detailImage"><img src={p.img}/></div><div className="detailCopy"><small>{p.category}</small><h1>{p.name}</h1><div className="stars">★★★★★ <span>({p.reviews} reviews)</span></div><div className="bigPrice">{money(p.price)} <del>{money(p.oldPrice)}</del> <mark>{Math.round((1-p.price/p.oldPrice)*100)}% OFF</mark></div><p>Premium quality product with a clean modern design, reliable performance, and excellent value. Carefully selected by ShopMate.</p><div className="stock">● {p.stock>5?"In stock":"Only "+p.stock+" left"}</div>{p.sizes.length>0&&<label className="option">Size<div>{p.sizes.map(x=><button className={size===x?"selected":""} onClick={()=>setSize(x)} key={x}>{x}</button>)}</div></label>}<label className="option">Color<div>{p.colors.map(x=><button className={color===x?"selected":""} onClick={()=>setColor(x)} key={x}>{x}</button>)}</div></label><div className="buyRow"><div className="qty"><button onClick={()=>setQty(Math.max(1,qty-1))}>−</button><b>{qty}</b><button onClick={()=>setQty(qty+1)}>+</button></div><button className="primary" onClick={()=>addToCart(p,qty)}>Add to Cart</button><button className="secondary" onClick={()=>{addToCart(p,qty);nav("checkout")}}>Buy Now</button><button className="wishBig" onClick={()=>toggleWish(p)}>{wished?"♥":"♡"}</button></div><div className="trust">🚚 Free delivery over $50 &nbsp; • &nbsp; 🔒 Secure checkout &nbsp; • &nbsp; ↩ 30-day returns</div></div></div><SectionTitle title="Customer Reviews" sub="Verified purchases from ShopMate customers."/><div className="reviewLong">{[1,2,3].map(i=><div key={i}><b>{["Rahul Ahmed","Sarah Khan","Imran Hossain"][i-1]}</b><div className="stars">★★★★★</div><p>Great product, fast delivery and exactly as described. I would buy again.</p></div>)}</div></main>}

function Cart({cart,setCart,total,discount,shipping,grand,coupon,setCoupon,couponApplied,setCouponApplied,nav}){return <main className="container"><div className="pageHead"><div><small>SHOPPING BAG</small><h1>Your Cart</h1></div></div>{!cart.length?<div className="empty"><h2>Your cart is empty</h2><p>Add something you love.</p><button className="primary" onClick={()=>nav("shop")}>Continue Shopping</button></div>:<div className="cartLayout"><section>{cart.map(x=><div className="cartItem" key={x.id}><img src={x.img}/><div><h3>{x.name}</h3><small>{x.category}</small><div className="price">{money(x.price)}</div></div><div className="qty"><button onClick={()=>setCart(c=>c.map(i=>i.id===x.id?{...i,qty:Math.max(1,i.qty-1)}:i))}>−</button><b>{x.qty}</b><button onClick={()=>setCart(c=>c.map(i=>i.id===x.id?{...i,qty:i.qty+1}:i))}>+</button></div><b>{money(x.price*x.qty)}</b><button className="remove" onClick={()=>setCart(c=>c.filter(i=>i.id!==x.id))}>×</button></div>)}<button className="secondary" onClick={()=>nav("shop")}>← Continue Shopping</button></section><aside className="summary"><h2>Order Summary</h2><div><span>Subtotal</span><b>{money(total)}</b></div><div><span>Discount</span><b>-{money(discount)}</b></div><div><span>Shipping</span><b>{shipping?money(shipping):"FREE"}</b></div><hr/><div className="grand"><span>Total</span><b>{money(grand)}</b></div><div className="coupon"><input value={coupon} onChange={e=>setCoupon(e.target.value.toUpperCase())} placeholder="Coupon code"/><button onClick={()=>setCouponApplied(coupon==="SAVE10")}>{couponApplied?"Applied":"Apply"}</button></div><small>Try <b>SAVE10</b> for 10% off.</small><button className="primary full" onClick={()=>nav("checkout")}>Proceed to Checkout →</button></aside></div>}</main>}

function Checkout({cart,total,discount,shipping,grand,user,setOrders,setCart,nav,notify}){
  const [form,setForm]=useState({name:user?.name||"",email:user?.email||"",phone:"",address:"",city:"Dhaka",country:"Bangladesh",postal:""});
  const [payment,setPayment]=useState("bkash");
  const [trxId,setTrxId]=useState("");
  const [senderNum,setSenderNum]=useState("");
  const [cardData,setCardData]=useState({num:"",exp:"",cvc:""});
  const bdtTotal=Math.round(grand*120);

  const submit=e=>{
    e.preventDefault();
    if(!cart.length)return;
    if(payment==="bkash"&&(!trxId||!senderNum)){
      alert("দয়া করে আপনার বিকাশ নম্বর এবং TrxID দিন");
      return;
    }
    if(payment==="nagad"&&(!trxId||!senderNum)){
      alert("দয়া করে আপনার নগদ নম্বর এবং TrxID দিন");
      return;
    }
    const order={
      id:"SM-"+Date.now().toString().slice(-6),
      date:new Date().toLocaleDateString(),
      total:grand,
      status:payment==="cod"?"Pending COD":(payment==="bkash"||payment==="nagad")?"Pending Verification":"Paid",
      paymentMethod:payment.toUpperCase(),
      trxId:trxId||(payment==="card"?"CARD-OK":"N/A"),
      senderNum:senderNum||"N/A",
      items:cart.map(x=>({name:x.name,qty:x.qty,img:x.img}))
    };
    setOrders(o=>[order,...o]);
    setCart([]);
    notify("অর্ডার সফলভাবে গ্রহণ করা হয়েছে!");
    nav("profile");
  };

  return <main className="container">
    <div className="pageHead"><div><small>CHECKOUT</small><h1>Secure Checkout</h1></div></div>
    <form className="checkout" onSubmit={submit}>
      <section className="formCard">
        <h2>Customer Information</h2>
        <div className="formGrid">
          <label>Full Name<input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your full name"/></label>
          <label>Email Address<input required type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com"/></label>
          <label>Phone Number<input required value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="017XXXXXXXX"/></label>
          <label>Delivery Address<input required value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="House, road, street address"/></label>
          <label>City<input required value={form.city} onChange={e=>setForm({...form,city:e.target.value})}/></label>
          <label>Country<input required value={form.country} onChange={e=>setForm({...form,country:e.target.value})}/></label>
          <label>Postal Code<input required value={form.postal} onChange={e=>setForm({...form,postal:e.target.value})} placeholder="1205"/></label>
        </div>

        <h2 style={{marginTop:"24px"}}>Select Payment Method</h2>
        <div className="paymentChoices">
          <label className={payment==="bkash"?"pay selected":"pay"}>
            <input type="radio" checked={payment==="bkash"} onChange={()=>setPayment("bkash")}/>
            <b style={{color:"#e2136e"}}>📱 bKash (বিকাশ)</b>
          </label>
          <label className={payment==="nagad"?"pay selected":"pay"}>
            <input type="radio" checked={payment==="nagad"} onChange={()=>setPayment("nagad")}/>
            <b style={{color:"#ea580c"}}>📲 Nagad (নগদ)</b>
          </label>
          <label className={payment==="ssl"?"pay selected":"pay"}>
            <input type="radio" checked={payment==="ssl"} onChange={()=>setPayment("ssl")}/>
            <b style={{color:"#0284c7"}}>💳 SSLCommerz</b>
          </label>
          <label className={payment==="card"?"pay selected":"pay"}>
            <input type="radio" checked={payment==="card"} onChange={()=>setPayment("card")}/>
            <b>🌐 Card (Stripe)</b>
          </label>
          <label className={payment==="cod"?"pay selected":"pay"}>
            <input type="radio" checked={payment==="cod"} onChange={()=>setPayment("cod")}/>
            <b>📦 Cash on Delivery</b>
          </label>
        </div>

        {payment==="bkash"&&<div className="pay-instruction bkash-box">
          <b>bKash পেমেন্ট নির্দেশিকা:</b>
          <p>১. আপনার বিকাশ অ্যাপ বা *247# থেকে <b>Send Money / Payment</b> করুন।</p>
          <p>২. বিকাশ নম্বর: <b>01614703406</b> (Personal / Merchant)</p>
          <p>৩. মোট টাকা: <b>৳{bdtTotal.toLocaleString()} BDT</b> ({money(grand)})</p>
          <p>৪. সফলভাবে পেমেন্ট করার পর প্রেরক নম্বর ও TrxID দিন:</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginTop:"10px"}}>

            <input placeholder="Transaction ID (TrxID)" value={trxId} onChange={e=>setTrxId(e.target.value)}/>
          </div>

        {payment==="nagad"&&<div className="pay-instruction nagad-box">
          <b>নগদ পেমেন্ট নির্দেশিকা:</b>
          <p>১. নগদ নম্বর: <b>01614703406</b> এ Send Money / Payment করুন।</p>
          <p>২. মোট টাকা: <b>৳{bdtTotal.toLocaleString()} BDT</b></p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginTop:"10px"}}>

        </div>}

        {payment==="ssl"&&<div className="pay-instruction ssl-box">

          <p>অর্ডার কনফার্ম করার পর আপনাকে SSLCommerz সিকিউর সার্ভারে রিডাইরেক্ট করে ভিসা/মাস্টারকার্ড বা মোবাইল ব্যাংকিংয়ের মাধ্যমে পেমেন্ট নেওয়া হবে।</p>
        </div>}

        {payment==="card"&&<div className="pay-instruction card-box">
          <b>Card Details:</b>
          <input style={{marginTop:"8px"}} placeholder="Card Number (4242 •••• •••• 4242)" value={cardData.num} onChange={e=>setCardData({...cardData,num:e.target.value})}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginTop:"8px"}}>
            <input placeholder="MM/YY" value={cardData.exp} onChange={e=>setCardData({...cardData,exp:e.target.value})}/>
            <input placeholder="CVC" value={cardData.cvc} onChange={e=>setCardData({...cardData,cvc:e.target.value})}/>
          </div>
        </div>}
      </section>

      <aside className="summary">
        <h2>Order Summary</h2>
        {cart.map(x=><div key={x.id}><span>{x.name} × {x.qty}</span><b>{money(x.price*x.qty)}</b></div>)}
        <hr/>
        <div><span>Subtotal</span><b>{money(total)}</b></div>
        <div><span>Discount</span><b>-{money(discount)}</b></div>
        <div><span>Shipping</span><b>{shipping?money(shipping):"FREE"}</b></div>
        <div className="grand"><span>Total (USD)</span><b>{money(grand)}</b></div>
        <div style={{color:"#667085",fontSize:"11px",textAlign:"right"}}>Approx: <b>৳{bdtTotal.toLocaleString()} BDT</b></div>
        <button className="primary full" type="submit">Confirm Order · {money(grand)}</button>
      </aside>
    </form>
  </main>
}

function Auth({mode,setUser,nav}){const [name,setName]=useState(""),[email,setEmail]=useState(""),[pass,setPass]=useState("");return <main className="authWrap"><form className="auth" onSubmit={e=>{e.preventDefault();setUser({name:name||email.split("@")[0],email});nav("profile")}}><div className="brand center">♜ ShopMate</div><h1>{mode==="login"?"Welcome Back":"Create Account"}</h1><p>{mode==="login"?"Sign in to continue shopping.":"Join ShopMate and manage your orders."}</p>{mode==="register"&&<input required placeholder="Full name" value={name} onChange={e=>setName(e.target.value)}/>}<input required type="email" placeholder="Email address" value={email} onChange={e=>setEmail(e.target.value)}/><input required type="password" minLength="6" placeholder="Password (6+ characters)" value={pass} onChange={e=>setPass(e.target.value)}/><button className="primary full">Continue</button><button type="button" className="linkBtn" onClick={()=>nav(mode==="login"?"register":"login")}>{mode==="login"?"Create an account":"Already have an account? Login"}</button></form></main>}

function Profile({user,orders,setUser,nav}){if(!user)return <Auth mode="login" setUser={setUser} nav={nav}/>;return <main className="container"><div className="profileHead"><div><small>MY ACCOUNT</small><h1>Hello, {user.name}</h1><p>{user.email}</p></div><button className="secondary" onClick={()=>{setUser(null);nav("home")}}>Logout</button></div><div className="accountGrid"><section className="formCard"><h2>My Orders</h2>{!orders.length?<div className="empty small">No orders yet. <button className="linkBtn" onClick={()=>nav("shop")}>Start shopping</button></div>:orders.map(o=><div className="order" key={o.id}><div><b>{o.id} ({o.paymentMethod||"COD"})</b><small>{o.date} · {o.items.length} items {o.trxId&&o.trxId!=="N/A"?`· TrxID: ${o.trxId}`:""}</small></div><span className={`status ${o.status.includes("Pending")?"pending":""}`}>{o.status}</span><b>{money(o.total)}</b></div>)}</section><section className="formCard"><h2>Account</h2><p>Saved Orders: <b>{orders.length}</b></p><button className="secondary full" onClick={()=>nav("wishlist")}>View Wishlist</button><button className="secondary full" onClick={()=>nav("admin")}>Open Admin Panel</button></section></div></main>}

function Wishlist({items,openProduct,addToCart,toggleWish}){return <main className="container"><div className="pageHead"><div><small>SAVED ITEMS</small><h1>Wishlist</h1><p>{items.length} saved products</p></div></div>{!items.length?<div className="empty"><h2>Your wishlist is empty</h2></div>:<div className="productGrid">{items.map(p=><ProductCard key={p.id} p={p} openProduct={openProduct} addToCart={addToCart} toggleWish={toggleWish} wished/>)}</div>}</main>}
function Categories({nav}){return <main className="container"><div className="pageHead"><div><small>EXPLORE</small><h1>Categories</h1><p>Find products by what you love.</p></div></div><div className="catGrid big">{categories.map(([name,img])=><button className="catCard" key={name} onClick={()=>nav("shop")}><img src={img}/><h3>{name}</h3><span>Explore →</span></button>)}</div></main>}
function About(){return <main className="container textPage"><small>ABOUT SHOPMATE</small><h1>Shop smart. Live better.</h1><p>ShopMate is a modern e-commerce experience designed around discovery, trust and simple checkout. This starter project includes a responsive storefront, product details, cart, wishlist, authentication UI, checkout flow and admin demo.</p><div className="featureBoxes"><div><b>Fast</b><p>Mobile-first and lightweight interface.</p></div><div><b>Secure</b><p>Ready for server-side authentication and payments.</p></div><div><b>Flexible</b><p>Easy to connect to Firebase, Supabase or a custom API.</p></div></div></main>}
function Contact(){return <main className="container textPage"><small>CONTACT</small><h1>We're here to help.</h1><div className="contactGrid"><div><h3>Customer Support</h3><p>support@shopmate.com</p><p>+880 1614703406</p><p>Dhaka, Bangladesh</p></div><form className="formCard" onSubmit={e=>{e.preventDefault();alert("Thanks! Your message has been queued in this demo.")}}><input required placeholder="Your name"/><input required type="email" placeholder="Email"/><textarea required placeholder="How can we help?"></textarea><button className="primary">Send Message</button></form></div></main>}
function Admin({orders,setOrders,notify}){const [status,setStatus]=useState("All");const statuses=["Pending","Confirmed","Processing","Shipped","Delivered","Cancelled"];const filtered=orders.filter(o=>status==="All"||o.status===status);return <main className="container"><div className="profileHead"><div><small>ADMIN PANEL</small><h1>Store Dashboard</h1><p>Manage customer orders, verify bKash & Nagad payments.</p></div></div><div className="stats"><div><small>Total Sales</small><b>${orders.reduce((s,o)=>s+o.total,0).toFixed(2)}</b></div><div><small>Total Orders</small><b>{orders.length}</b></div><div><small>Products</small><b>{products.length}</b></div><div><small>Customers</small><b>128</b></div></div><div className="formCard"><div className="toolbar"><h2>Manage Orders & Payments</h2><select value={status} onChange={e=>setStatus(e.target.value)}><option>All</option>{statuses.map(s=><option key={s}>{s}</option>)}</select></div>{filtered.length?filtered.map(o=><div className="order" key={o.id}><div><b>{o.id} — {o.paymentMethod||"COD"}</b><small>{o.date} · {o.items.map(i=>i.name).join(", ")} {o.trxId&&o.trxId!=="N/A"?` | TrxID: ${o.trxId}`:""} {o.senderNum&&o.senderNum!=="N/A"?` | From: ${o.senderNum}`:""}</small></div><select value={o.status} onChange={e=>{setOrders(os=>os.map(x=>x.id===o.id?{...x,status:e.target.value}:x));notify("Order status updated")}}>{statuses.map(s=><option key={s}>{s}</option>)}</select><b>{money(o.total)}</b></div>):<div className="empty small">No orders yet. Place a demo order to see it here.</div>}</div></main>}
function Newsletter(){const [email,setEmail]=useState("");return <div className="newsletter"><div><span>✉</span><div><h3>Subscribe to Our Newsletter</h3><p>Get the latest updates on new products and special offers.</p></div></div><form onSubmit={e=>{e.preventDefault();alert("Subscribed: "+email);setEmail("")}}><input required type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Enter your email address"/><button>Subscribe</button></form></div>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
